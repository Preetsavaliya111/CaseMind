# Loaded inside nginx's http block. Access logs omit URLs, query strings and tokens.
log_format casemind '$request_method $status $request_time';
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout casemind;
    error_log /dev/stderr crit;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 'healthy'; }
    location ~ ^/api/v1/auth/(login|register|mfa/verify|password-reset/request)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 100s;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 100s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
