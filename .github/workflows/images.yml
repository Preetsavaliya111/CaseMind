name: Prepare release images
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish SHA-tagged images after the release revision passes CI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: image-publish
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lowercase image namespace
        id: namespace
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ steps.namespace.outputs.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
