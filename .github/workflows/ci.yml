name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r ../backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CASEMIND_BROWSER_PRODUCTION: '1'
          CASEMIND_BROWSER_API: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: casemind_test
          POSTGRES_USER: casemind
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casemind -d casemind_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg2://casemind:disposable-ci-only@127.0.0.1:5432/casemind_test
      SECRET_KEY: test-secret-key-with-at-least-32-characters
      GROQ_API_KEY: ''
      GEMINI_API_KEY: ''
      SMTP_HOST: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/verify_migrations.py
      - run: python scripts/verify_workflows_postgres.py
      - run: python ../scripts/validate_release_config.py --compose

  production-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: casemind-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Backend image import and liveness configuration
        if: matrix.service == 'backend'
        run: >-
          docker run --rm -e ENVIRONMENT=test -e DATABASE_URL=sqlite://
          -e SECRET_KEY=test-secret-key-with-at-least-32-characters
          casemind-backend:ci python -c "from main import app; assert app"
      - name: Frontend Nginx configuration
        if: matrix.service == 'frontend'
        run: docker run --rm --add-host backend:127.0.0.1 casemind-frontend:ci nginx -t
