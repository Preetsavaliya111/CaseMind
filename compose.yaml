services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casemind
      POSTGRES_USER: casemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casemind-local}
    ports:
      - "5432:5432"
    volumes:
      - casemind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casemind -d casemind"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - casemind-qdrant:/qdrant/storage

volumes:
  casemind-postgres:
  casemind-qdrant:
